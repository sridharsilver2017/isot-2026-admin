<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="burgundyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B5123A" />
      <stop offset="100%" stop-color="#7E102B" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="100%" stop-color="#E5A51A" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background Shield/Rounded Square -->
  <rect width="512" height="512" rx="112" fill="url(#burgundyGrad)" />

  <!-- Outer Ring Accent -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="url(#goldGrad)" stroke-width="6" stroke-dasharray="16 8" opacity="0.6"/>

  <!-- Stylized Kidney / Heart / Cell Synthesis -->
  <g transform="translate(256, 230) scale(1.15)" filter="url(#shadow)">
    <!-- Kidney Left Lobe -->
    <path d="M-20,-80 C-80,-80 -120,-30 -120,30 C-120,90 -70,130 -10,130 C-40,90 -40,30 -10,-10 C0,-30 0,-70 -20,-80 Z" fill="#FFFFFF" opacity="0.95"/>
    
    <!-- Kidney Right Lobe -->
    <path d="M20,-80 C80,-80 120,-30 120,30 C120,90 70,130 10,130 C40,90 40,30 10,-10 C0,-30 0,-70 20,-80 Z" fill="url(#goldGrad)"/>

    <!-- Central Caduceus / Cross of Life -->
    <circle cx="0" cy="15" r="14" fill="#B5123A"/>
    <path d="M-6,30 L6,30 L4,75 L-4,75 Z" fill="#B5123A"/>
    <path d="M-20,40 L20,40" stroke="#B5123A" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- ISOT 2026 Typography -->
  <text x="256" y="415" font-family="'Outfit', 'Inter', sans-serif" font-weight="800" font-size="46" fill="#FFFFFF" text-anchor="middle" letter-spacing="4">ISOT 2026</text>
  <text x="256" y="450" font-family="'Inter', sans-serif" font-weight="600" font-size="20" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="6">HYDERABAD</text>
</svg>
